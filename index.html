<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ha2fde's Site</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5; color: #333; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .container { text-align: center; padding: 2rem; }
        h1 { font-size: 3rem; margin-bottom: 1rem; color: #2c3e50; }
        p { font-size: 1.2rem; color: #666; line-height: 1.8; }
        .links { margin-top: 2rem; }
        .links a {
            display: inline-block; margin: 0 0.5rem; padding: 0.6rem 1.5rem;
            background: #3498db; color: #fff; text-decoration: none;
            border-radius: 6px; font-size: 1rem; transition: background 0.2s;
        }
        .links a:hover { background: #2980b9; }
        footer { margin-top: 3rem; color: #999; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome</h1>
        <p>Hi, this is Ha2fde's personal site, hosted on GitHub Pages.</p>
        <div class="links">
            <a href="https://github.com/ha2fde">GitHub</a>
        </div>
        <footer>&copy; 2026 Ha2fde</footer>
    </div>
</body>
</html>
