<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ha2fde's Blog</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
            background: #f8f9fa; color: #333; line-height: 1.7;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem 1.5rem; }
        header { padding: 3rem 0 2rem; border-bottom: 1px solid #eee; margin-bottom: 2rem; }
        h1 { font-size: 2rem; color: #1a1a2e; }

        .post { display: flex; gap: 1.5rem; align-items: flex-start; }
        .post-thumb {
            width: 100px; height: 100px; border-radius: 8px; flex-shrink: 0;
            background: #eef6ff; display: flex; align-items: center;
            justify-content: center; font-size: 2.5rem;
        }
        .post-title { font-size: 1.3rem; font-weight: 600; }
        .post-title a { color: #1a1a2e; text-decoration: none; }
        .post-title a:hover { color: #3498db; }
        .post-meta { font-size: 0.85rem; color: #999; margin-top: 0.3rem; }
        .post-desc { font-size: 0.95rem; color: #555; margin-top: 0.5rem; }

        footer { text-align: center; padding: 2rem; color: #999; font-size: 0.85rem; }

        @media (max-width: 600px) {
            .container { padding: 1.5rem 1rem; }
            header { padding: 2rem 0 1.5rem; }
            .post { gap: 1rem; }
            .post-thumb { width: 64px; height: 64px; font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Ha2fde's Blog</h1>
        </header>

        <div class="post">
            <div class="post-thumb">🧭</div>
            <div>
                <div class="post-title"><a href="posts/agent-principles/">Agent 原理与实践</a></div>
                <div class="post-meta">6 章 · 约 150 分钟 · 2026-08-06</div>
                <div class="post-desc">从装上第一个 Agent 讲到 AGI 的五条路线：客户端与模型怎么组合、Transformer 为什么管用、续写模型怎么变成会干活的东西、tools 与 MCP 各自解决什么、上线前必须答上来的问题。</div>
            </div>
        </div>
    </div>

    <footer>&copy; 2026 Ha2fde</footer>
</body>
</html>
